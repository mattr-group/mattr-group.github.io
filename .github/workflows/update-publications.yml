name: Update publications

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Rebuild data/publications.json from ORCID and Crossref
        run: python3 scripts/update_publications.py

      - name: Commit if anything changed
        run: |
          if [ -n "$(git status --porcelain data/publications.json)" ]; then
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/publications.json
            git commit -m "Update publications from ORCID"
            git push
          else
            echo "No change."
          fi
